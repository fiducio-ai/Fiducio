name: Publish to PyPI (manual)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to upload the validated release tag'
        required: true
        default: ""
permissions:
  contents: read
concurrency:
  group: pypi-publish
  cancel-in-progress: false
jobs:
  release-gate:
    if: inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.3"
          python-version: "3.11"
      - run: uv run --no-project --python 3.11 python scripts/check_release.py
  validation:
    needs: release-gate
    uses: ./.github/workflows/validate.yml
  publish:
    needs: [release-gate, validation]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fiducio
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Publish exactly the tested artifacts with attestations
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
