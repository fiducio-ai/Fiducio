name: Publish to PyPI (manual)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to upload the validated release tag'
        required: true
        default: ""
permissions:
  contents: read
concurrency:
  group: pypi-publish
  cancel-in-progress: false
jobs:
  release-gate:
    if: inputs.confirm == 'publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.3"
          python-version: "3.11"
      - run: uv run --no-project --python 3.11 python scripts/check_release.py
  validation:
    needs: release-gate
    uses: ./.github/workflows/validate.yml
  publish:
    needs: [release-gate, validation]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fiducio
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - name: Publish exactly the tested artifacts with attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: true
