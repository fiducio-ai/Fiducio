# PyPI publishing via Trusted Publishing (OpenID Connect, no long-lived tokens).
#
# DISABLED BY DEFAULT: this workflow only runs when started manually
# (workflow_dispatch) AND requires confirmation. Before the first publish you
# must configure a Trusted Publisher for the `fiducio` project on PyPI and create
# a protected `pypi` environment in the repository settings. No API token is
# stored in the repository.
name: Publish to PyPI (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm uploading to PyPI'
        required: true
        default: ""

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event.inputs.confirm == 'publish' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fiducio
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true
          python-version: "3.11"

      - name: Sync locked build tools
        run: uv sync --locked --only-group build

      - name: Build wheel and sdist
        run: uv build --no-build-isolation

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
