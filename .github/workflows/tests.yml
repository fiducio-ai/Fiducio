name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync locked CPU test environment
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run --no-sync ruff check .

      - name: Type check (mypy)
        run: uv run --no-sync mypy --python-version ${{ matrix.python-version }}

      - name: Run tests with coverage
        run: uv run --no-sync pytest --cov=fiducio --cov-report=term-missing

      - name: Run CPU examples
        run: |
          uv run --no-sync python examples/basic_segmentation_calibration.py
          uv run --no-sync python examples/pytorch_model_calibration.py
          uv run --no-sync python examples/reliability_diagram.py
          uv run --no-sync python examples/ensemble_pooling.py

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true
          python-version: "3.11"

      - name: Sync locked documentation environment
        run: uv sync --locked --no-dev --extra docs

      - name: Build documentation (strict)
        run: uv run --no-sync mkdocs build --strict
